name: Go

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Install goversioninfo
      run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

    - name: Build
      run: make all

    - name: Upload pull request build
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: WinCryptSSHAgent-${{ github.event.pull_request.head.sha }}
        path: WinCryptSSHAgent*.exe
        if-no-files-found: error

    - name: Upload Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: 'WinCryptSSHAgent*.exe'
        prerelease: true
